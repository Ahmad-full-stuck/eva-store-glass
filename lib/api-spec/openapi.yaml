openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Store API for products, orders, and customer messages.
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: catalog
    description: Product and taxonomy operations
  - name: orders
    description: Order operations
  - name: contact
    description: Customer message operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Server health status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /readyz:
    get:
      operationId: readinessCheck
      tags: [health]
      summary: Readiness check
      responses:
        "200":
          description: Service is ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
        "503":
          description: Service is not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
  /products:
    get:
      operationId: listProducts
      tags: [catalog]
      summary: List products
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Category"
        - $ref: "#/components/parameters/InStock"
        - $ref: "#/components/parameters/MinPrice"
        - $ref: "#/components/parameters/MaxPrice"
        - $ref: "#/components/parameters/ProductSort"
      responses:
        "200":
          description: Product list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductListResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
  /products/{id}:
    get:
      operationId: getProduct
      tags: [catalog]
      summary: Get a product
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        "200":
          description: Product details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"
  /categories:
    get:
      operationId: listCategories
      tags: [catalog]
      summary: List categories
      responses:
        "200":
          description: Category list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryListResponse"
  /routes:
    get:
      operationId: listRoutes
      tags: [catalog]
      summary: List storefront routes
      responses:
        "200":
          description: Storefront route list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteListResponse"
  /governorates:
    get:
      operationId: listGovernorates
      tags: [catalog]
      summary: List governorates and delivery fees
      responses:
        "200":
          description: Governorate list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GovernorateListResponse"
  /contact:
    post:
      operationId: createContactMessage
      tags: [contact]
      summary: Create a customer message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactRequest"
      responses:
        "201":
          description: Message accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "503":
          $ref: "#/components/responses/ServiceBusy"
  /orders:
    post:
      operationId: createOrder
      tags: [orders]
      summary: Create an order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderRequest"
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "503":
          $ref: "#/components/responses/ServiceBusy"
  /orders/{orderNumber}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: Get an order by order number
      parameters:
        - $ref: "#/components/parameters/OrderNumber"
      responses:
        "200":
          description: Order details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  parameters:
    Search:
      name: search
      in: query
      required: false
      schema:
        type: string
        maxLength: 120
    Category:
      name: category
      in: query
      required: false
      schema:
        type: string
        maxLength: 100
    InStock:
      name: inStock
      in: query
      required: false
      schema:
        type: boolean
    MinPrice:
      name: minPrice
      in: query
      required: false
      schema:
        type: number
        minimum: 0
        maximum: 100000000
    MaxPrice:
      name: maxPrice
      in: query
      required: false
      schema:
        type: number
        minimum: 0
        maximum: 100000000
    ProductSort:
      name: sort
      in: query
      required: false
      schema:
        type: string
        enum: [featured, price_asc, price_desc, low, high, newest, name]
        default: featured
    ProductId:
      name: id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 100
        pattern: "^[A-Za-z0-9][A-Za-z0-9_-]*$"
    OrderNumber:
      name: orderNumber
      in: path
      required: true
      schema:
        type: string
        pattern: "^EVA-[A-F0-9]{24}$"
  responses:
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Request conflicts with current resource state
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnprocessableEntity:
      description: Request is syntactically valid but cannot be processed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PayloadTooLarge:
      description: Request payload is too large
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceBusy:
      description: Service is temporarily busy
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HealthResponse:
      type: object
      required: [status, ready, storage, databaseConfigured, checkedAt]
      properties:
        status:
          type: string
        ready:
          type: boolean
        storage:
          type: string
          enum: [memory, database]
        databaseConfigured:
          type: boolean
        checkedAt:
          type: string
          format: date-time
    ReadyResponse:
      type: object
      required: [status, ready, storage, databaseConfigured, checkedAt]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        ready:
          type: boolean
        storage:
          type: string
          enum: [memory, database]
        databaseConfigured:
          type: boolean
        checkedAt:
          type: string
          format: date-time
    Product:
      type: object
      required:
        - id
        - slug
        - name
        - type
        - categoryId
        - category
        - price
        - currency
        - unit
        - image
        - color
        - colors
        - width
        - composition
        - stretch
        - weight
        - finish
        - use
        - description
        - inStock
        - stockQuantity
        - stockStatus
        - stock
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        slug:
          type: string
        name:
          type: string
        type:
          type: string
        categoryId:
          type: string
        category:
          type: string
        price:
          type: integer
          minimum: 0
        currency:
          type: string
          enum: [IQD]
        unit:
          type: string
          enum: [m]
        image:
          type: string
        color:
          type: string
        colors:
          type: array
          minItems: 1
          items:
            type: string
        width:
          type: string
        composition:
          type: string
        stretch:
          type: string
        weight:
          type: string
        finish:
          type: string
        use:
          type: string
        description:
          type: string
        inStock:
          type: boolean
        stockQuantity:
          type: integer
          minimum: 0
        stockStatus:
          type: string
          enum: [in_stock, low_stock, out_of_stock]
        stock:
          type: string
          enum: [متوفر, كمية محدودة, غير متوفر]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ProductListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        meta:
          type: object
          required: [count]
          properties:
            count:
              type: integer
              minimum: 0
    ProductResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Product"
    Category:
      type: object
      required: [id, slug, name, description]
      properties:
        id:
          type: string
        slug:
          type: string
        name:
          type: string
        description:
          type: string
    CategoryListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Category"
    SiteRoute:
      type: object
      required: [id, label, path, header]
      properties:
        id:
          type: string
        label:
          type: string
        path:
          type: string
        header:
          type: boolean
    RouteListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/SiteRoute"
    Governorate:
      type: object
      required: [id, name, deliveryFee]
      properties:
        id:
          type: string
        name:
          type: string
        deliveryFee:
          type: integer
          minimum: 0
    GovernorateListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Governorate"
    ContactRequest:
      type: object
      required: [name, phone, message]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        phone:
          type: string
          minLength: 7
          maxLength: 24
        message:
          type: string
          minLength: 10
          maxLength: 2000
    ContactMessage:
      type: object
      required: [id, name, phone, message, status, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
        phone:
          type: string
        message:
          type: string
        status:
          type: string
          enum: [new]
        createdAt:
          type: string
          format: date-time
    ContactResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/ContactMessage"
    OrderItemInput:
      type: object
      required: [productId]
      properties:
        productId:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9_-]*$"
        quantity:
          type: number
          minimum: 0.5
          maximum: 100
        length:
          type: number
          minimum: 0.5
          maximum: 100
        color:
          type: string
          minLength: 1
          maxLength: 50
        colorName:
          type: string
          minLength: 1
          maxLength: 50
    OrderRequest:
      type: object
      required: [name, phone, governorate, address, items]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        phone:
          type: string
          minLength: 7
          maxLength: 24
        governorate:
          type: string
          enum:
            - baghdad
            - basra
            - nineveh
            - erbil
            - sulaymaniyah
            - kirkuk
            - anbar
            - babil
            - karbala
            - najaf
            - wasit
            - maysan
            - dhi-qar
            - muthanna
            - diwaniyah
            - duhok
            - halabja
            - saladin
        district:
          type: string
          maxLength: 100
          default: ""
        address:
          type: string
          minLength: 5
          maxLength: 500
        notes:
          type: string
          maxLength: 1000
        items:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: "#/components/schemas/OrderItemInput"
    OrderItem:
      type: object
      required:
        - productId
        - productSlug
        - productName
        - image
        - color
        - unitPrice
        - quantity
        - lineTotal
      properties:
        productId:
          type: string
        productSlug:
          type: string
        productName:
          type: string
        image:
          type: string
        color:
          type: string
        unitPrice:
          type: integer
          minimum: 0
        quantity:
          type: number
          minimum: 0.5
        lineTotal:
          type: integer
          minimum: 0
    Order:
      type: object
      required:
        - id
        - orderNumber
        - status
        - customer
        - governorate
        - district
        - address
        - items
        - subtotal
        - deliveryFee
        - total
        - currency
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        orderNumber:
          type: string
          pattern: "^EVA-[A-F0-9]{24}$"
        status:
          type: string
          enum: [pending]
        customer:
          type: object
          required: [name, phone]
          properties:
            name:
              type: string
            phone:
              type: string
        governorate:
          type: string
        district:
          type: string
        address:
          type: string
        notes:
          type: string
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/OrderItem"
        subtotal:
          type: integer
          minimum: 0
        deliveryFee:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0
        currency:
          type: string
          enum: [IQD]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    OrderResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Order"
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
        requestId:
          type: string
